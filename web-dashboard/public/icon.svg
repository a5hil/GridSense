<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="zapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- High-contrast SCADA Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Subtle Substation Grid Lines -->
  <line x1="18" y1="3" x2="18" y2="61" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />
  <line x1="32" y1="3" x2="32" y2="61" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />
  <line x1="46" y1="3" x2="46" y2="61" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />
  <line x1="3" y1="18" x2="61" y2="18" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />
  <line x1="3" y1="32" x2="61" y2="32" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />
  <line x1="3" y1="46" x2="61" y2="46" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />

  <!-- Center Zap Bolt -->
  <g transform="translate(6.8, 6.8) scale(2.1)">
    <polygon
      points="13 2 3 14 12 14 11 22 21 10 12 10"
      fill="url(#zapGrad)"
      stroke="#6ee7b7"
      stroke-width="0.75"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#zapGlow)"
    />
  </g>
</svg>